<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>Ticket Reservation</title>
    <meta
     name="description" content="Reserve tickets to the film premiere of the sci-fi drama short-film Synapse 2066."/>
    <meta
     name="keywords" content="Synapse 2066, world of Synapse, indie film, student film, futuristic film, sci-fi aesthetics, reservations, free tickets, premiere, free"/>
    <meta
      name="author" content="Synapse 2066 Web Team"/>
    <meta
       name="language" content="English"/>
    <!-- Cannonical URL -->
     <link rel="canonical" href="https://synapse2066.netlify.app/tickets">
    <!-- Robots controls -->
     <meta name="robots" content="index, follow" />
    <!-- Open Graph -->
    <meta property="og:title" content="Synapse 2066 - Ticket Reservation">
    <meta property="og:description" content="Reserve tickets to the film premiere of the sci-fi drama short-film Synapse 2066.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://synapse2066.netlify.app/tickets">
   
    <!-- favicon -->
    <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Synapse" />
    <link rel="manifest" href="/images/favicon/site.webmanifest" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="savecss/forms.css">
</head>
<body>
    <main>
        <div class="bgSection"></div>
        <section class="contentSection">

            <!-- BIG TITLE -->
            <div class="filmTitle">
                <h1>Synapse 2066</h1>
                <div class="shapes">
                    <div class="vl"></div>
                    <span class="dot"></span>
                </div>
            </div>

            <div class="contentBox">

                <!-- TITLE -->
                <div class="titleBox descrBox">
                    <p class="formTitle">Free Premiere Tickets</p>
                    <button class="btn_icon"><a href="/index.html"><img src="/images/icons/x-icon.svg" alt=""></a></button>
                </div>

                <!-- EVENT DETAILS -->
                <div class="detailsBox descrBox">
                    <div id="location" class="details">
                        <p>Location:&nbsp</p>
                        <p>SAE House, 297 Kingsland Rd, London E8 4DD</p>
                    </div>
                    <div id="date" class="details">
                        <p>Date:&nbsp</p>
                        <p>12/12/25</p>
                    </div>
                </div>

                <div class="infoBox">
                    <div class="instructionTexts">
                        <p>Please enter your information and add one ticket for each guest:</p>
                    </div>

                    <!-- FORM -->
                     <!-- action for php: PHP/tickets_reservations.php -->
                    <form action="" method="post" id="tickets_form" netlify>

                        <!-- ERROR MESSAGES -->
                       <p class="error_name hidden"></p>
                       <p class="error_email hidden"></p>

                       <!-- INPUT FIELDS -->
                        <div class="form">
                            <div class="userInfo formPart">
                                <div class="nameBox formBox">
                                    <label class="labelUser" id="name_label" for="name">Name:</label>
                                    <input type="text" name="name" id="name">
                                </div>
                                <div class="emailBox formBox">
                                    <label class="labelUser" for="email">Email:</label>
                                    <input type="email" name="email" id="email">
                                </div>
                            </div>
                            <div class="tickets formPart">
                                <div class="ticketBox formBox">
                                    <label  class="labelUser" for="numberOfTickets">Number of Tickets:</label>
                                    <input type="number" name="numberOfTickets" id="numberOfTickets" min="1" max="40" value="1">
                                </div>
                            </div>
                        </div>  

                        <!-- VALIDATION BUTTON -->
                        <button type="submit" class="btn_primary" id="submit" name="submit">Submit</button>
                    </form>
                    </div>

                </div>
        </section>
    </main>
</body>
    <script type="module" src="/Javascript/form-validation.js"></script>
</html>
